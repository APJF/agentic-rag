name: Build & Push Python Backend to ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

# Quyền tối thiểu để tránh cảnh báo “excessive permissions”
permissions:
  contents: read

concurrency:
  group: build-acr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: apjfregistry.azurecr.io
  IMAGE_NAME: apjf-rag

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, giảm cảnh báo multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta (generate tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false              # tránh cảnh báo nếu registry không hỗ trợ SLSA/provenance
          cache-from: type=gha
          cache-to: type=gha,mode=max